<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Helena Roy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500&family=Inter:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --text:#1A1A1A; --muted:#6B6B70; --accent:#1D4ED8;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; line-height:1.62;
  display:flex; min-height:100vh; align-items:center; justify-content:center; text-align:center;}
.box{max-width:480px; padding:32px;}
h1{font-family:'Spectral',Georgia,serif; font-weight:500; font-size:48px; letter-spacing:-0.01em; margin:0 0 8px;}
p{font-size:17px; margin:0 0 18px;}
.code{font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-transform:uppercase; letter-spacing:0.09em; color:var(--muted); margin:0 0 16px;}
a{color:var(--text); text-decoration:none; border-bottom:1px solid var(--accent);}
a:hover{color:var(--accent);}
a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404 — Page not found</div>
    <h1>Helena Roy</h1>
    <p>That page doesn't exist. <a href="/">Return home</a>.</p>
  </div>
</body>
</html>
